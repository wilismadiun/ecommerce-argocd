apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: my-envoy-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80