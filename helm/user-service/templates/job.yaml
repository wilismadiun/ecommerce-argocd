apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: {{ .Values.image.migration }}:{{ .Values.image.tag }}
          imagePullPolicy: Always

          env:
          # configmap
          - name: DB_HOST
            valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_HOST
          - name: DB_PORT
            valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_PORT
          - name: DB_NAME
            valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_NAME
          - name: DB_SSLMODE
            valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_SSLMODE

          # secret
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secret
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-secret
                key: DB_PASSWORD