apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-pv-volume
  labels:
    type: local
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data/{{ .Release.Name }}"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-pv-claim
  annotations:
    "helm.sh/resource-policy": keep   # Agar objek PV tidak ikut terhapus saat helm uninstall
    argocd.argoproj.io/sync-wave: "0"
spec:
  volumeName: {{ .Release.Name }}-pv-volume
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi